root@DevAP-Wazuh-Local:~# cat /var/ossec/etc/ossec.conf
<!--
  Wazuh - Manager Configuration - DevAP-Wazuh-Local
  Base: default configuration for Ubuntu 20.04
  More info at: https://documentation.wazuh.com

  ══════════════════════════════════════════════════════════════════
  FILE STRUCTURE (in order):
    1. Global settings
    2. Integrations (custom-agent-status, custom-telegram, virustotal)
    3. Alerts / logging
    4. Remote connections (agent traffic + syslog)
    5. Policy monitoring (rootcheck, SCA, vulnerability-detection)
    6. Wodles (osquery, syscollector, cis-cat)
    7. Indexer
    8. Syscheck / FIM (files + Windows registry — single consolidated block)
    9. Active response + commands
   10. Localfiles (log collection)
   11. Ruleset
   12. Auth (agent enrollment)
   13. Cluster
  ══════════════════════════════════════════════════════════════════

  SECURITY NOTES CARRIED OVER FROM REVIEW (not changed here, flagged for you):
    - virustotal api_key below is in plaintext. Rotate it, then move to a
      secure include mechanism rather than committing it in this file.
    - <auth> currently has use_password=no, use_source_ip=no,
      ssl_verify_host=no — any host that can reach :1515 can self-enroll.
    - syslog <remote> allowed-ips is 0.0.0.0/0 — open to the internet.
    - <active-response> is globally disabled — commands below are inert.
  These are unchanged from your original file; only structure and the
  duplicate <syscheck> block were fixed per your request.
-->

<ossec_config>

  <!-- ══════════════════════════════════════════════════════════════
       1. GLOBAL SETTINGS
       ══════════════════════════════════════════════════════════════ -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>yes</logall_json>

    <email_notification>no</email_notification>
    <smtp_server>smtp.example.wazuh.com</smtp_server>
    <email_from>wazuh@example.wazuh.com</email_from>
    <email_to>recipient@example.wazuh.com</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>

    <update_check>yes</update_check>
    <agents_disconnection_time>30s</agents_disconnection_time>
    <agents_disconnection_alert_time>0s</agents_disconnection_alert_time>
  </global>

  <!-- ══════════════════════════════════════════════════════════════
       2. INTEGRATIONS
       Matches: /var/ossec/integrations/custom-telegram
                /var/ossec/integrations/security_events/*
       ══════════════════════════════════════════════════════════════ -->

  <!-- Feeds security_events/handlers/* dispatch via RULE_CATEGORY_MAP -->
  <integration>
    <name>custom-telegram</name>
    <hook_url>https://api.telegram.org</hook_url>  <!-- placeholder, unused by script -->
    <alert_format>json</alert_format>
    <level>3</level>  <!-- must stay <= config.MIN_LEVEL in security_events/config.py -->
  </integration>

  <!-- Agent connect/disconnect/reconnect notifications -->
  <!-- Rule IDs must match local_rules.xml Section 14 (Agent Status & Management) -->
  <integration>
    <name>custom-agent-status</name>
    <rule_id>100500,100501,501,504,100031,506,100591</rule_id>
    <!-- NOTE: 100591 not found in local_rules.xml as provided — verify this ID -->
    <alert_format>json</alert_format>
  </integration>

  <!-- Feeds fim.py hardware/malware checks; matches FIM group in syscheck below -->
  <integration>
    <name>virustotal</name>
    <api_key>280cae9dd0c16dd4a9c9098786113c08ed2a3b5d9d252f96a69d3504607df581</api_key>
    <!-- SECURITY: rotate this key, then load via secure include, not plaintext -->
    <group>syscheck</group>
    <alert_format>json</alert_format>
  </integration>

  <!-- ══════════════════════════════════════════════════════════════
       3. ALERTS / LOGGING
       ══════════════════════════════════════════════════════════════ -->
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>
  <logging>
    <log_format>plain</log_format>
  </logging>

  <!-- ══════════════════════════════════════════════════════════════
       4. REMOTE CONNECTIONS
       ══════════════════════════════════════════════════════════════ -->

  <!-- Agent traffic -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- Syslog forwarders -->
  <remote>
    <connection>syslog</connection>
    <port>515</port>
    <protocol>udp</protocol>
    <allowed-ips>0.0.0.0/0</allowed-ips>
    <!-- SECURITY: scope this to your actual forwarder subnet, e.g. 192.168.136.0/24 -->
  </remote>

  <!-- ══════════════════════════════════════════════════════════════
       5. POLICY MONITORING
       ══════════════════════════════════════════════════════════════ -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>

    <frequency>43200</frequency>  <!-- every 12 hours -->

    <rootkit_files>etc/rootcheck/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>

    <skip_nfs>yes</skip_nfs>

    <ignore>/var/lib/containerd</ignore>
    <ignore>/var/lib/docker/overlay2</ignore>
  </rootcheck>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

  <!-- ══════════════════════════════════════════════════════════════
       6. WODLES
       ══════════════════════════════════════════════════════════════ -->
  <wodle name="cis-cat">
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan-on-start>yes</scan-on-start>
    <java_path>wodles/java</java_path>
    <ciscat_path>wodles/ciscat</ciscat_path>
  </wodle>

  <wodle name="osquery">
    <disabled>yes</disabled>
    <run_daemon>yes</run_daemon>
    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>
    <add_labels>yes</add_labels>
  </wodle>

  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
    <users>yes</users>
    <groups>yes</groups>
    <services>yes</services>
    <browser_extensions>yes</browser_extensions>

    <synchronization>
      <max_eps>10</max_eps>
    </synchronization>
  </wodle>

  <!-- ══════════════════════════════════════════════════════════════
       7. INDEXER
       ══════════════════════════════════════════════════════════════ -->
  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://192.168.136.181:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/filebeat/certs/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/filebeat/certs/wazuh-server.pem</certificate>
      <key>/etc/filebeat/certs/wazuh-server-key.pem</key>
    </ssl>
  </indexer>
  <!-- ══════════════════════════════════════════════════════════════
       8. SYSCHECK / FILE INTEGRITY MONITORING
       Single consolidated block (previously duplicated — merged here).
       Realtime paths below map directly to local_rules.xml Section 8
       (FIM: 100010, 100040-100042) and Section 15 (USB/Hardware).
       ══════════════════════════════════════════════════════════════ -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>

    <!-- Scheduled scan only (every 12h) -->
    <directories>/etc,/usr/bin,/usr/sbin</directories>
    <directories>/bin,/sbin,/boot</directories>

    <!-- Realtime — high value, feeds rule 100010 (critical file changes) -->
    <directories check_all="yes" report_changes="yes" realtime="yes">/etc/passwd,/etc/shadow,/etc/sudoers</directories>
    <!-- Wazuh integration + rules self-protection — feeds rules 100040-100042 -->

    <!-- Web content -->

    <!-- Ignore noise -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <!-- FIXED 2026-07-06: unescaped '.' in this regex matches ANY
         character, not a literal dot, meaning filenames like "alog" or
         "blog" (not real .log files) would also match and be silently
         ignored by FIM — a narrow false-negative risk of suppressing
         legitimate file-change events that merely end in similar
         letters. Escaped the dots so only genuine .log/.swp/.pyc
         extensions match. -->
    <ignore type="sregex">\.log$|\.swp$|\.pyc$</ignore>

    <!-- Ignore integration internals — matches config.py FIM_NOISE_PATHS -->
    <ignore>/var/ossec/integrations/pycache</ignore>
    <ignore>/var/ossec/integrations/security_events/pycache</ignore>
    <ignore>/var/ossec/integrations/security_events/handlers/pycache</ignore>
    <ignore>/var/ossec/integrations/security_events/utils/pycache</ignore>
    <ignore>/var/ossec/integrations/.wazuh_telegram_dedup.json</ignore>
    <ignore>/var/ossec/integrations/.wazuh_telegram_dedup.json.lock</ignore>
    <ignore type="sregex">\.agent-|\.watcher|\.test-write|\.lock$|\.pending\.json$|\.state\.json$|\.disconnect</ignore>

    <nodiff>/etc/ssl/private.key</nodiff>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <process_priority>10</process_priority>
    <!-- FIXED 2026-07-06: raised from 50. This server runs an active
         production web server (/var/www, /var/nginx under realtime FIM)
         with real traffic. At 50 events/sec, a legitimate traffic burst
         (session writes, cache updates, uploads) could consume the
         entire budget, causing changes to higher-value realtime paths
         like /etc/passwd or /var/ossec/integrations arriving in the
         same window to be delayed or dropped — a false-negative risk on
         our most critical paths. Raised rather than removing realtime
         coverage from the web directories, since that's exactly where a
         web-shell upload or defacement would need to be caught. -->
    <max_eps>200</max_eps>

    <!-- Windows USB/HID registry monitoring — feeds rules 100060-100064, 100080-100083
         Consolidated to one syntax style (was previously duplicated in both
         short-form and <key>/<arch> block-form). -->
    <windows_registry realtime="yes" arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Enum\USB</windows_registry>
    <windows_registry realtime="yes" arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Enum\USBSTOR</windows_registry>
    <windows_registry realtime="yes" arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Enum\HID</windows_registry>
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>
    <!-- add_fim_dir.sh added 2026-07-17 18:04:23 by rathana: /var/ossec/integrations -->
    <directories check_all="yes" report_changes="yes" realtime="yes">/var/ossec/integrations</directories>
  </syscheck>

  <!-- ══════════════════════════════════════════════════════════════
       9. ACTIVE RESPONSE
       Currently disabled globally — commands defined below are inert
       until <active-response> blocks wire them to specific rules/levels.
       ══════════════════════════════════════════════════════════════ -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <command>
    <name>disable-account</name>
    <executable>disable-account</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>restart-wazuh</name>
    <executable>restart-wazuh</executable>
  </command>

  <command>
    <name>host-deny</name>
    <executable>host-deny</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>route-null</name>
    <executable>route-null</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>win_route-null</name>
    <executable>route-null.exe</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>netsh</name>
    <executable>netsh.exe</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- ══════════════════════════════════════════════════════════════
       10. LOCALFILES — LOG COLLECTION
       Grouped by purpose: system health, auth, hardware/USB, general.
       ══════════════════════════════════════════════════════════════ -->

  <!-- System health / inventory commands -->
  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -tulpn | sed 's/\([[:alnum:]]\+\)\ \+[[:digit:]]\+\ \+[[:digit:]]\+\ \+\(.*\):\([[:digit:]]*\)\ \+\([0-9\.\:\*]\+\).\+\ \([[:digit:]]*\/[[:alnum:]\-]*\).*/\1 \2 == \3 == \4 \5/' | sort -k 4 -g | sed 's/ == \(.*\) ==/:\1/' | sed 1,2d</command>
    <alias>netstat listening ports</alias>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>last -n 20</command>
    <frequency>360</frequency>
  </localfile>

  <!-- Authentication -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Hardware / USB events — Linux -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>

  <localfile>
    <log_format>journald</log_format>
    <location>kernel</location>
  </localfile>

  <!-- Hardware / USB events — macOS -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/system.log</location>
  </localfile>

  <!-- PowerShell script-block/command logging — feeds rules 100009, 100025 -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-PowerShell/Operational</location>
  </localfile>

  <!-- Hardware / USB events — Windows (event channels; registry watch is in syscheck above) -->
  <localfile>
    <location>Microsoft-Windows-DriverFrameworks-UserMode/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-Kernel-PnP/Configuration</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Web server access log — feeds rule 100013 (web attack detection) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <!-- General system / package / Wazuh internal logs -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>